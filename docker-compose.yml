version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://accessmap:accessmap_secret@db:5432/accessmap
      - AUTH_SECRET=change-me-to-a-secure-random-string-in-production
      - AUTH_URL=http://localhost:3000
      - NODE_ENV=production
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=accessmap
      - POSTGRES_PASSWORD=accessmap_secret
      - POSTGRES_DB=accessmap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessmap -d accessmap"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
